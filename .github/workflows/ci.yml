name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test Rust observer
        run: cargo test --manifest-path telemetry/Cargo.toml --offline

      - name: Rust format check
        run: cargo fmt --manifest-path telemetry/Cargo.toml --check

      - name: Install AI worker dependencies
        run: pip install --no-deps -r ai/requirements.txt

      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: models
          key: onnx-models-${{ hashFiles('ai/fetch_models.py') }}

      - name: Fetch ONNX models
        run: python ai/fetch_models.py models

      - name: Test AI worker
        run: python -m unittest discover -s ai -p 'test_*.py'

      - name: Build application
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/contextual-ad-lab .

      - name: Build container
        run: docker build -t contextual-ad-lab:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name contextual-ad-lab-ci -p 127.0.0.1:18080:8080 contextual-ad-lab:${{ github.sha }}
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/api/observability | grep -q 'events_received'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/observability | grep -q 'events_received'
          curl --fail --silent http://127.0.0.1:18080/ | grep -q "Make every break"
          curl --fail --silent http://127.0.0.1:18080/demo/ | grep -q "Find the"
          docker exec contextual-ad-lab-ci python3 --version
          docker exec -w /app/ai contextual-ad-lab-ci python3 -c "import numpy, onnxruntime, cv2, scenedetect, PIL, visual, audio; visual._session(); audio._model(); print('models ok')"
          docker stop contextual-ad-lab-ci
